<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Kunal Srivastava, Cyber Security Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00f5ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2748" stroke-width="1"/>
    </pattern>
    <clipPath id="rc"><rect width="900" height="340" rx="18"/></clipPath>
    <clipPath id="reveal">
      <rect x="30" y="90" width="0" height="150">
        <animate attributeName="width" from="0" to="640" dur="1.6s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .mono{font-family:'Courier New',Consolas,monospace}
    .col{font:12px 'Courier New',monospace;fill:#00f5ff;opacity:.15;writing-mode:vertical-rl;text-orientation:upright;animation:fall 7s linear infinite}
    @keyframes fall{from{transform:translateY(-260px)}to{transform:translateY(360px)}}
    .cyc{opacity:0;animation:cyc 9s infinite}
    @keyframes cyc{0%{opacity:0}5%,29%{opacity:1}33%,100%{opacity:0}}
    .blink{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{opacity:0}}
    .fadein{opacity:0;animation:fadein 1s 2s forwards}
    @keyframes fadein{to{opacity:1}}
  </style>

  <g clip-path="url(#rc)">
    <rect width="900" height="340" fill="url(#bg)"/>
    <rect width="900" height="340" fill="url(#grid)" opacity=".5"/>

    <!-- matrix rain -->
    <text class="col" x="40"  style="animation-duration:7s;animation-delay:-1s">10110100111010</text>
    <text class="col" x="110" style="animation-duration:9s;animation-delay:-4s">01101001010110</text>
    <text class="col" x="180" style="animation-duration:6s;animation-delay:-2s">11010010110101</text>
    <text class="col" x="250" style="animation-duration:8s;animation-delay:-6s">00101101001011</text>
    <text class="col" x="320" style="animation-duration:10s;animation-delay:-3s">10100110101001</text>
    <text class="col" x="390" style="animation-duration:7.5s;animation-delay:-5s">01011010011010</text>
    <text class="col" x="460" style="animation-duration:6.5s;animation-delay:-2.5s">11001011010010</text>
    <text class="col" x="530" style="animation-duration:9.5s;animation-delay:-7s">00110101101001</text>
    <text class="col" x="600" style="animation-duration:8.5s;animation-delay:-1.5s">10010110100101</text>
    <text class="col" x="870" style="animation-duration:7s;animation-delay:-3.5s">01101011001011</text>

    <!-- radar -->
    <circle cx="730" cy="175" r="150" fill="url(#glow)"/>
    <g fill="none" stroke="#00f5ff" stroke-opacity=".35">
      <circle cx="730" cy="175" r="105"/>
      <circle cx="730" cy="175" r="70"/>
      <circle cx="730" cy="175" r="35"/>
      <line x1="625" y1="175" x2="835" y2="175"/>
      <line x1="730" y1="70" x2="730" y2="280"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 730 175" to="360 730 175" dur="4s" repeatCount="indefinite"/>
      <path d="M730 175 L835 175 A105 105 0 0 0 817 116.3 Z" fill="#00f5ff" opacity=".22"/>
      <line x1="730" y1="175" x2="835" y2="175" stroke="#00f5ff" stroke-width="2"/>
    </g>
    <!-- blips -->
    <circle cx="690" cy="215" r="4" fill="#00f5ff"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="765" cy="225" r="4" fill="#00f5ff"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="698" cy="135" r="4" fill="#00f5ff"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="775" cy="128" r="5" fill="#f43f5e"/>
    <circle cx="775" cy="128" r="5" fill="none" stroke="#f43f5e" stroke-width="2">
      <animate attributeName="r" values="5;22" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="790" y="124" class="mono" font-size="11" fill="#f43f5e">THREAT</text>

    <!-- text -->
    <text x="40" y="70" class="mono" font-size="15" fill="#00f5ff">&gt; cyber_security_engineer --status online</text>
    <g clip-path="url(#reveal)">
      <text x="38" y="150" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="66" letter-spacing="3" fill="url(#ac)">KUNAL</text>
      <text x="38" y="222" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="66" letter-spacing="3" fill="url(#ac)">SRIVASTAVA</text>
    </g>

    <g class="mono" font-size="20" fill="#e2e8f0">
      <text class="cyc" x="40" y="268" style="animation-delay:0s">Python Developer</text>
      <text class="cyc" x="40" y="268" style="animation-delay:3s">Frontend Enthusiast</text>
      <text class="cyc" x="40" y="268" style="animation-delay:6s">Building CyberGuardian XDR</text>
    </g>
    <rect class="blink" x="40" y="278" width="14" height="3" fill="#00f5ff"/>
    <text class="fadein mono" x="40" y="310" font-size="13" font-style="italic" fill="#94a3b8">"Sometimes you gotta run before you can walk."</text>
  </g>
  <rect x=".5" y=".5" width="899" height="339" rx="18" fill="none" stroke="#1e2a4d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

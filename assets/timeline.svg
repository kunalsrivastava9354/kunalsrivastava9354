<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Kunal's journey timeline" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="rc"><rect width="900" height="270" rx="18"/></clipPath>
  </defs>
  <style>
    .yr{font:700 13px 'Courier New',Consolas,monospace;fill:#00f5ff}
    .tt{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#f1f5f9}
    .sb{font:12px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
  </style>

  <g clip-path="url(#rc)">
    <rect width="900" height="270" fill="url(#bg)"/>
    <text x="40" y="34" font-family="'Courier New',monospace" font-size="13" fill="#64748b">// journey.log</text>

    <!-- main line, draws itself then loops -->
    <line x1="60" y1="140" x2="60" y2="140" stroke="url(#ln)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" values="60;840;840" keyTimes="0;.3;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;.92;1" dur="12s" repeatCount="indefinite"/>
    </line>

    <!-- 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.02;.06;.92;1" dur="12s" repeatCount="indefinite"/>
      <line x1="110" y1="128" x2="110" y2="112" stroke="#334155"/>
      <circle cx="110" cy="140" r="10" fill="#0b1226" stroke="#00f5ff" stroke-width="3"/>
      <text x="110" y="62" text-anchor="middle" class="tt">B.Tech begins</text>
      <text x="110" y="82" text-anchor="middle" class="sb">Cyber Security, Gurugram Univ.</text>
      <text x="110" y="104" text-anchor="middle" class="yr">Sep 2023</text>
    </g>
    <!-- 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.084;.124;.92;1" dur="12s" repeatCount="indefinite"/>
      <line x1="280" y1="152" x2="280" y2="168" stroke="#334155"/>
      <circle cx="280" cy="140" r="10" fill="#0b1226" stroke="#38bdf8" stroke-width="3"/>
      <text x="280" y="186" text-anchor="middle" class="yr">Along the way</text>
      <text x="280" y="208" text-anchor="middle" class="tt">Built CyberGuardian XDR</text>
      <text x="280" y="226" text-anchor="middle" class="sb">+ Cyber Security Toolkit</text>
    </g>
    <!-- 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.15;.19;.92;1" dur="12s" repeatCount="indefinite"/>
      <line x1="450" y1="128" x2="450" y2="112" stroke="#334155"/>
      <circle cx="450" cy="140" r="10" fill="#0b1226" stroke="#60a5fa" stroke-width="3"/>
      <text x="450" y="62" text-anchor="middle" class="tt">Cyber Security Intern</text>
      <text x="450" y="82" text-anchor="middle" class="sb">Gurugram Police Cyber Security Cell</text>
      <text x="450" y="104" text-anchor="middle" class="yr">Jun - Jul 2026</text>
    </g>
    <!-- 4 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.216;.256;.92;1" dur="12s" repeatCount="indefinite"/>
      <line x1="620" y1="152" x2="620" y2="168" stroke="#334155"/>
      <circle cx="620" cy="140" r="10" fill="#0b1226" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="620" cy="140" r="10" fill="none" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="r" values="10;26" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="620" y="186" text-anchor="middle" class="yr">Now</text>
      <text x="620" y="208" text-anchor="middle" class="tt">Frontend + web engineering</text>
      <text x="620" y="226" text-anchor="middle" class="sb">Open to opportunities</text>
    </g>
    <!-- 5 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.28;.32;.92;1" dur="12s" repeatCount="indefinite"/>
      <line x1="790" y1="128" x2="790" y2="112" stroke="#334155"/>
      <circle cx="790" cy="140" r="10" fill="#0b1226" stroke="#c084fc" stroke-width="3"/>
      <text x="790" y="62" text-anchor="middle" class="tt">Graduation</text>
      <text x="790" y="82" text-anchor="middle" class="sb">B.Tech completes</text>
      <text x="790" y="104" text-anchor="middle" class="yr">Jun 2027</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="269" rx="18" fill="none" stroke="#1e2a4d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

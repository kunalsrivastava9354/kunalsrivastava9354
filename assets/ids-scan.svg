<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="CyberGuardian XDR traffic classification animation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="rc"><rect width="900" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Courier New',Consolas,monospace}
    .bt{font:700 13px 'Courier New',Consolas,monospace;fill:#e2e8f0}
    .bs{font:11px 'Courier New',Consolas,monospace;fill:#94a3b8}
  </style>

  <g clip-path="url(#rc)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <text x="40" y="44" class="mono" font-size="18" font-weight="700" letter-spacing="2" fill="#00f5ff">CYBERGUARDIAN XDR</text>
    <text x="40" y="64" class="mono" font-size="12" fill="#94a3b8">network intrusion detection · live traffic classification</text>

    <!-- tracks -->
    <path d="M40 150 H620" stroke="#1e2a4d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M620 150 L800 100" stroke="#14532d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M620 150 L800 200" stroke="#7f1d1d" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- stage boxes -->
    <rect x="120" y="120" width="120" height="60" rx="10" fill="#0b1226" stroke="#00f5ff" stroke-opacity=".6"/>
    <text x="180" y="147" text-anchor="middle" class="bt">SCAPY</text>
    <text x="180" y="165" text-anchor="middle" class="bs">capture</text>

    <rect x="290" y="120" width="120" height="60" rx="10" fill="#0b1226" stroke="#38bdf8" stroke-opacity=".6"/>
    <text x="350" y="147" text-anchor="middle" class="bt">FEATURES</text>
    <text x="350" y="165" text-anchor="middle" class="bs">extract</text>

    <rect x="450" y="112" width="140" height="76" rx="12" fill="#8b5cf6" opacity=".35" filter="url(#blur)">
      <animate attributeName="opacity" values=".15;.5;.15" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="450" y="112" width="140" height="76" rx="12" fill="#0b1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="520" y="144" text-anchor="middle" class="bt">RF + XGBoost</text>
    <text x="520" y="164" text-anchor="middle" class="bs">classify</text>

    <!-- outcomes -->
    <rect x="800" y="80" width="84" height="40" rx="10" fill="#052e16" stroke="#34d399"/>
    <text x="842" y="105" text-anchor="middle" class="bt" style="fill:#34d399">ALLOW</text>
    <rect x="800" y="180" width="84" height="40" rx="10" fill="#2a0a12" stroke="#f43f5e">
      <animate attributeName="stroke-opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="842" y="205" text-anchor="middle" class="bt" style="fill:#f43f5e">ALERT</text>

    <!-- packets: benign -->
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#00f5ff" opacity="0">
      <animateMotion path="M40 150 H620 L800 100" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#00f5ff;#00f5ff;#34d399;#34d399" keyTimes="0;.74;.75;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.9;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <!-- malicious -->
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#00f5ff" opacity="0">
      <animateMotion path="M40 150 H620 L800 200" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#00f5ff;#00f5ff;#f43f5e;#f43f5e" keyTimes="0;.74;.75;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.9;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#00f5ff" opacity="0">
      <animateMotion path="M40 150 H620 L800 100" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#00f5ff;#00f5ff;#34d399;#34d399" keyTimes="0;.74;.75;1" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.9;1" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#00f5ff" opacity="0">
      <animateMotion path="M40 150 H620 L800 100" dur="6s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#00f5ff;#00f5ff;#34d399;#34d399" keyTimes="0;.74;.75;1" dur="6s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.9;1" dur="6s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#00f5ff" opacity="0">
      <animateMotion path="M40 150 H620 L800 200" dur="6s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#00f5ff;#00f5ff;#f43f5e;#f43f5e" keyTimes="0;.74;.75;1" dur="6s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.9;1" dur="6s" begin="4.8s" repeatCount="indefinite"/>
    </rect>

    <text x="450" y="272" text-anchor="middle" class="mono" font-size="12" fill="#64748b">Python · Scapy · Random Forest · XGBoost</text>
  </g>
  <rect x=".5" y=".5" width="899" height="299" rx="18" fill="none" stroke="#1e2a4d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="GeoThermX: urban heat island hotspots detected, simulated cooling, and the AI pipeline" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="blocks" width="50" height="38" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="42" height="30" rx="3" fill="#111b38"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="map"><rect x="40" y="90" width="300" height="190" rx="12"/></clipPath>
    <clipPath id="rc"><rect width="900" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Courier New',Consolas,monospace}
    .bt{font:700 13px 'Courier New',Consolas,monospace;fill:#e2e8f0}
    .bs{font:11px 'Courier New',Consolas,monospace;fill:#94a3b8}
  </style>

  <g clip-path="url(#rc)">
    <rect width="900" height="340" fill="url(#bg)"/>

    <text x="40" y="44" class="mono" font-size="20" font-weight="700" letter-spacing="2" fill="url(#hot)">GEOTHERMX</text>
    <text x="40" y="64" class="mono" font-size="12" fill="#94a3b8">AI-powered urban heat island intelligence · BAH 2026</text>

    <!-- ===== MAP ===== -->
    <rect x="40" y="90" width="300" height="190" rx="12" fill="#0b1226"/>
    <rect x="40" y="90" width="300" height="190" fill="url(#blocks)" clip-path="url(#map)"/>

    <g clip-path="url(#map)">
      <!-- BEFORE: heat hotspots -->
      <g filter="url(#blur)">
        <g>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.4;.55;.88;1" dur="10s" repeatCount="indefinite"/>
          <circle cx="120" cy="150" r="36" fill="#ef4444"><animate attributeName="r" values="34;42;34" dur="2s" repeatCount="indefinite"/></circle>
          <circle cx="250" cy="215" r="44" fill="#f97316"><animate attributeName="r" values="42;50;42" dur="2.4s" repeatCount="indefinite"/></circle>
          <circle cx="220" cy="130" r="28" fill="#ef4444"><animate attributeName="r" values="26;33;26" dur="1.8s" repeatCount="indefinite"/></circle>
        </g>
        <!-- AFTER: cooled -->
        <g>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.55;.88;1" dur="10s" repeatCount="indefinite"/>
          <circle cx="120" cy="150" r="30" fill="#22c55e"/>
          <circle cx="250" cy="215" r="36" fill="#38bdf8"/>
          <circle cx="220" cy="130" r="22" fill="#22c55e"/>
        </g>
      </g>

      <!-- trees appear during cooling -->
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.6;.88;1" dur="10s" repeatCount="indefinite"/>
        <circle cx="100" cy="140" r="5" fill="#16a34a"/><circle cx="140" cy="165" r="5" fill="#16a34a"/>
        <circle cx="235" cy="205" r="5" fill="#16a34a"/><circle cx="265" cy="228" r="5" fill="#16a34a"/>
        <circle cx="215" cy="120" r="5" fill="#16a34a"/><circle cx="238" cy="142" r="5" fill="#16a34a"/>
        <circle cx="300" cy="170" r="5" fill="#16a34a"/><circle cx="70" cy="230" r="5" fill="#16a34a"/>
      </g>

      <!-- satellite scan line -->
      <rect x="40" y="90" width="300" height="2" fill="#00f5ff" opacity=".7">
        <animate attributeName="y" values="90;278;90" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="40" y="90" width="300" height="190" rx="12" fill="none" stroke="#1e2a4d"/>

    <text x="40" y="306" class="bt" style="fill:#fb923c">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.4;.55;.88;1" dur="10s" repeatCount="indefinite"/>
      BEFORE · urban heat hotspots detected
    </text>
    <text x="40" y="306" class="bt" style="fill:#34d399">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.55;.88;1" dur="10s" repeatCount="indefinite"/>
      AFTER · cooling intervention simulated
    </text>

    <!-- ===== PIPELINE ===== -->
    <path d="M490 135 H540" stroke="#1e2a4d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M650 135 L700 90"  stroke="#1e2a4d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M650 135 H700"     stroke="#1e2a4d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M650 135 L700 180" stroke="#1e2a4d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M780 199 V232" stroke="#1e2a4d" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- data packets (behind the boxes) -->
    <circle r="5" fill="#fb923c" opacity="0">
      <animateMotion path="M380 135 H650 L700 90" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#fbbf24" opacity="0">
      <animateMotion path="M380 135 H700" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#34d399" opacity="0">
      <animateMotion path="M380 135 H650 L700 180" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#00f5ff" opacity="0">
      <animateMotion path="M780 199 V232" dur="1.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- stage boxes -->
    <rect x="380" y="110" width="110" height="50" rx="10" fill="#0b1226" stroke="#fb923c" stroke-opacity=".7"/>
    <text x="435" y="132" text-anchor="middle" class="bt">SATELLITE</text>
    <text x="435" y="148" text-anchor="middle" class="bs">LST · NDVI · NDBI</text>

    <rect x="540" y="104" width="110" height="62" rx="12" fill="#8b5cf6" opacity=".35" filter="url(#blur)">
      <animate attributeName="opacity" values=".1;.45;.1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="110" width="110" height="50" rx="10" fill="#0b1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="595" y="132" text-anchor="middle" class="bt">RANDOM FOREST</text>
    <text x="595" y="148" text-anchor="middle" class="bs">predict LST</text>

    <rect x="700" y="71"  width="160" height="38" rx="10" fill="#2a0f0f" stroke="#f43f5e" stroke-opacity=".8"/>
    <text x="780" y="94"  text-anchor="middle" class="bt" style="fill:#fb7185">HOTSPOT DETECTION</text>
    <rect x="700" y="116" width="160" height="38" rx="10" fill="#052e16" stroke="#34d399" stroke-opacity=".8"/>
    <text x="780" y="139" text-anchor="middle" class="bt" style="fill:#34d399">COOLING SIMULATOR</text>
    <rect x="700" y="161" width="160" height="38" rx="10" fill="#1a1536" stroke="#a78bfa" stroke-opacity=".8"/>
    <text x="780" y="184" text-anchor="middle" class="bt" style="fill:#c4b5fd">GEMINI AI INSIGHTS</text>

    <rect x="380" y="232" width="480" height="44" rx="10" fill="#0b1226" stroke="#00f5ff" stroke-opacity=".6"/>
    <text x="620" y="252" text-anchor="middle" class="bt">INTERACTIVE GIS DASHBOARD</text>
    <text x="620" y="268" text-anchor="middle" class="bs">React · Leaflet · Chart.js · FastAPI</text>

    <text x="620" y="306" text-anchor="middle" class="mono" font-size="12" fill="#64748b">"From Satellite Data to Sustainable Decisions"</text>
  </g>
  <rect x=".5" y=".5" width="899" height="339" rx="18" fill="none" stroke="#1e2a4d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Scrolling stream of skills" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".08" stop-color="#fff"/>
      <stop offset=".92" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="m"><rect width="900" height="170" fill="url(#fade)"/></mask>
    <clipPath id="rc"><rect width="900" height="170" rx="18"/></clipPath>

    <g id="row1">
      <g><rect x="0"   width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="55"  y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Python</text></g>
      <g><rect x="124" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="179" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Java</text></g>
      <g><rect x="248" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="303" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">C</text></g>
      <g><rect x="372" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="427" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">SQL</text></g>
      <g><rect x="496" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="551" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">HTML</text></g>
      <g><rect x="620" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="675" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">CSS</text></g>
      <g><rect x="744" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="799" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Git</text></g>
      <g><rect x="868" width="110" height="34" rx="17" fill="#07202a" stroke="#00f5ff"/><text x="923" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">GitHub</text></g>
    </g>

    <g id="row2">
      <g><rect x="0"   width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="55"  y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Cryptography</text></g>
      <g><rect x="124" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="179" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Hashing</text></g>
      <g><rect x="248" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="303" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Phishing</text></g>
      <g><rect x="372" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="427" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Malware</text></g>
      <g><rect x="496" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="551" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Auth</text></g>
      <g><rect x="620" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="675" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Social Eng.</text></g>
      <g><rect x="744" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="799" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">Scapy</text></g>
      <g><rect x="868" width="110" height="34" rx="17" fill="#1a1536" stroke="#a78bfa"/><text x="923" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="13" fill="#e2e8f0">XGBoost</text></g>
    </g>
  </defs>

  <g clip-path="url(#rc)">
    <rect width="900" height="170" fill="url(#bg)"/>
    <text x="40" y="28" font-family="'Courier New',monospace" font-size="13" fill="#64748b">// skill_stream.run()</text>

    <g mask="url(#m)">
      <g transform="translate(0 46)">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-992 0" dur="24s" repeatCount="indefinite"/>
          <use href="#row1"/>
          <use href="#row1" x="992"/>
        </g>
      </g>
      <g transform="translate(0 100)">
        <g>
          <animateTransform attributeName="transform" type="translate" from="-992 0" to="0 0" dur="28s" repeatCount="indefinite"/>
          <use href="#row2"/>
          <use href="#row2" x="992"/>
        </g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="169" rx="18" fill="none" stroke="#1e2a4d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
